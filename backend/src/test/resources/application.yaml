spring:
  datasource:
    url: jdbc:h2:mem:bookify;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

jwt:
  secret: test-only-secret-key-with-at-least-thirty-two-bytes
  expiration: 60000
