spring:
  application:
    name: bookify-backend

  datasource:
    url: ${BOOKIFY_DB_URL}
    username: ${BOOKIFY_DB_USERNAME}
    password: ${BOOKIFY_DB_PASSWORD}

  flyway:
    enabled: true
    validate-migration-naming: true
    locations:
      - classpath:db/migration
      - classpath:db/vendor/{vendor}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${BOOKIFY_SERVER_PORT:8080}
  shutdown: graceful

jwt:
  secret: ${BOOKIFY_JWT_SECRET}
  expiration: ${BOOKIFY_JWT_EXPIRATION_MS:86400000}

bookify:
  invitations:
    expiration-hours: ${BOOKIFY_INVITATION_EXPIRATION_HOURS:72}
  semantic:
    enabled: ${BOOKIFY_SEMANTIC_ENABLED:false}
    provider: ${BOOKIFY_SEMANTIC_PROVIDER:mock}
    candidate-limit: ${BOOKIFY_SEMANTIC_CANDIDATE_LIMIT:100}
    rerank-limit: ${BOOKIFY_SEMANTIC_RERANK_LIMIT:50}
    timeout-ms: ${BOOKIFY_SEMANTIC_TIMEOUT_MS:5000}
    nvidia:
      api-key: ${NVIDIA_API_KEY:}
      embedding-url: ${BOOKIFY_NVIDIA_EMBEDDING_URL:https://integrate.api.nvidia.com/v1/embeddings}
      embedding-model: ${BOOKIFY_NVIDIA_EMBEDDING_MODEL:nvidia/llama-nemotron-embed-1b-v2}
      reranking-url: ${BOOKIFY_NVIDIA_RERANKING_URL:https://ai.api.nvidia.com/v1/retrieval/nvidia/llama-nemotron-rerank-1b-v2/reranking}
      reranking-model: ${BOOKIFY_NVIDIA_RERANKING_MODEL:nvidia/llama-nemotron-rerank-1b-v2}
      connect-timeout-ms: ${BOOKIFY_NVIDIA_CONNECT_TIMEOUT_MS:1000}
      read-timeout-ms: ${BOOKIFY_NVIDIA_READ_TIMEOUT_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
